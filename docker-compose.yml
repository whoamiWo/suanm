services:
  postgres:
    image: postgres:17-alpine
    container_name: sm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sm
      POSTGRES_PASSWORD: sm
      POSTGRES_DB: sm
      TZ: Asia/Shanghai
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sm -d sm']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: sm-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
